namespace:
  create: true
  name: algocrack

ingress:
  enabled: true
  className: nginx
  host: algocrack.local

# This committed values file contains no credentials. Create these Secrets
# externally before installation, or use an ignored my-values.local.yaml.
secrets:
  useExisting: true
  appSecretName: algocrack-app-secrets
  jwtSecretName: jwt-signing-keys

auth:
  google:
    clientId: ""
    clientSecret: ""
    redirectUri: http://algocrack.local/api/v1/auth/login/oauth2/code/google
  jwt:
    privateKeyPem: ""
    publicKeyPem: ""

mysql:
  enabled: true
  auth:
    rootPassword: ""
    username: root
    password: ""

redis:
  enabled: true

services:
  codeExecutionEngine:
    workerCount: 5
  frontend:
    publicApiBaseUrl: ""
    internalApiBaseUrl: http://api-gateway:9090
