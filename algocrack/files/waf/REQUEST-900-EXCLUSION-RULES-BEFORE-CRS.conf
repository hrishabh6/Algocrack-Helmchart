# Reviewed AlgoCrack exclusion 10001006: CRS 932130 on ARGS:json.code.
SecRule REQUEST_METHOD "@rx ^(?:POST)$" \
    "id:10001006,phase:1,pass,nolog,t:none,chain"
    SecRule REQUEST_FILENAME "@rx ^(?:/api/v1/submissions|/api/v1/submissions/run|/api/v1/submissions/custom)/?$" \
        "t:none,ctl:ruleRemoveTargetById=932130;ARGS:json.code"

