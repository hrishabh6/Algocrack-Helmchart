# Narrow false-positive exclusions for AlgoCrack source fields.
#
# Submission JSON field "code" (SubmissionRequestDto, RunRequestDto,
# CustomExecutionRequestDto) is exposed by the JSON body processor as
# ARGS:json.code. Query parameters are a different collection member
# (ARGS:code) and stay inspected.
#
# Paths for rule 10001001:
#   POST /api/v1/submissions
#   POST /api/v1/submissions/run
#   POST /api/v1/submissions/custom
#
# Only attack-sqli and attack-xss are removed for that body field.
# questionId, language, headers, the path, and the query string stay inspected.
#
# Phase 2, loaded before the CRS attack rules, so the ctl actions apply
# when those rules run.

SecRule REQUEST_METHOD "@streq POST" \
    "id:10001001,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_URI "@rx ^/api/v1/submissions(?:/(?:run|custom))?/?($|\?)" \
        "t:none,\
        ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.code,\
        ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.code"

# Playground JSON field "sourceCode" (PlaygroundCreateRequest,
# PlaygroundUpdateRequest, PlaygroundRunRequest) is ARGS:json.sourceCode.
# Blocking mode denied SQL and script text in that field before this rule.
# Query parameter sourceCode stays inspected.
#   POST /api/v1/playgrounds
#   POST /api/v1/playgrounds/run
#   PUT  /api/v1/playgrounds/{id}
SecRule REQUEST_METHOD "@rx ^(?:POST|PUT)$" \
    "id:10001003,\
    phase:2,\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_URI "@rx ^/api/v1/playgrounds(?:/(?:run|[^/]+))?/?($|\?)" \
        "t:none,\
        ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.sourceCode,\
        ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.sourceCode"



# Local Google OAuth: prevent a false SSRF match on the redirect_uri parameter.
# Applies only to this endpoint and CRS rule 934110.
SecRule REQUEST_FILENAME "@streq /api/v1/auth/oauth2/authorization/google" \
    "id:10001004,phase:1,pass,nolog,t:none,ctl:ruleRemoveTargetById=934110;ARGS:redirect_uri"

# Google OAuth callback false-positive exclusions.
# Only the specified inputs are excluded from their respective CRS rules.
# All other request inputs and security rules remain inspected.
SecRule REQUEST_FILENAME "@streq /api/v1/auth/login/oauth2/code/google" \
    "id:10001005,phase:1,pass,nolog,t:none,\
    ctl:ruleRemoveTargetById=930120;ARGS:scope,\
    ctl:ruleRemoveTargetById=934110;REQUEST_COOKIES:redirect_uri"

