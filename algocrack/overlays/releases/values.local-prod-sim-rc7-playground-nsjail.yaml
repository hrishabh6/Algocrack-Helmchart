# NOT APPLIED. Do not helm-upgrade revision 13 until this overlay is explicitly approved.
#
# Java Playground only. Non-Java playground execution is rejected by Submission
# Service and by CXE ingress, so it is not sent to NsJail or the local-process
# worker. SUBMISSION routing is not changed here. Apply this file on top of the
# revision 13 values so that routing stays PERSISTENT_NSJAIL.
#
# Frontend nav visibility is PLAYGROUND_UI_ENABLED on the frontend Pod. It is
# independent of the backend API and execution flags below.
#
# Image tags are immutable release candidates. Load them into Minikube before
# upgrade. Do not apply this file by itself.

images:
  codeExecutionEngine:
    repository: hrishabhjoshi/code-execution-engine
    tag: v1.0.0-rc.7-cxe-c8e9c06
    pullPolicy: Never
  frontend:
    repository: hrishabhjoshi/frontend
    tag: v1.0.0-rc.7-fe-16c46db
    pullPolicy: Never
  submissionService:
    repository: hrishabhjoshi/submission-service
    tag: v1.0.0-rc.7-ss-fddf3d5
    pullPolicy: Never

nsjailRunner:
  enabled: true
  phase7LiveRoutingAcknowledged: true
  image:
    repository: hrishabhjoshi/cxe-nsjail-runner
    tag: v1.0.0-rc.7-runner-bd6ad5d
    pullPolicy: Never

services:
  frontend:
    runtimeFeatures:
      playgroundEnabled: true
  codeExecutionEngine:
    executionRouting:
      playgroundBackend: PERSISTENT_NSJAIL
    playgroundApi:
      enabled: true
      runEnabled: true
    executionV2:
      enabled: true
      reaperEnabled: true
      persistentRunnerEnabled: true
