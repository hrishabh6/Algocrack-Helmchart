# Local production-simulation overlay for release candidate v1.0.0-rc.2.
#
# This overlay deliberately reuses the existing cluster Secrets. Do not put
# credentials, JWT keys, OAuth values, or INTERNAL_SERVICE_TOKEN here.
# See helm/RC2_DEPLOYMENT_RUNBOOK.md before adopting existing resources.
#
# Phase A (pre-sandbox-runbook): static/API complexity only; CXE profile Jobs stay off.
# Historical Phase B overlay is retained beside this file as
# values.local-prod-sim-rc2-complexity-dynamic.yaml. It is not part of the
# current CXE runner migration.

namespace:
  # The namespace already exists and holds the database volumes and Secrets.
  # Leaving it out of the release keeps `helm uninstall` from deleting it.
  create: false
  name: algocrack

# Existing Minikube Deployments use immutable `app: <component>` selectors.
# This must be removed after a deliberate migration to native chart selectors.
adoption:
  legacySelectors: true

images:
  apiGateway:
    tag: v1.0.0-rc.2
    pullPolicy: IfNotPresent
  authService:
    tag: v1.0.0-rc.2
    pullPolicy: IfNotPresent
  problemService:
    tag: v1.0.0-rc.2
    pullPolicy: IfNotPresent
  submissionService:
    tag: v1.0.0-rc.2
    pullPolicy: IfNotPresent
  codeExecutionEngine:
    tag: v1.0.0-rc.2
    pullPolicy: IfNotPresent
  frontend:
    tag: v1.0.0-rc.2
    pullPolicy: IfNotPresent
  waf:
    tag: v1.0.0-rc.2
    pullPolicy: IfNotPresent

ingress:
  enabled: true
  # Google allows plain HTTP only for localhost, and the published auth image
  # only accepts post-login redirects that start with http://localhost:3000.
  # Reach this host with: kubectl -n ingress-nginx port-forward svc/ingress-nginx-controller 3000:80
  host: localhost

services:
  codeExecutionEngine:
    backend: kubernetes-job
  frontend:
    # Browser calls are relative (/api/...) so ingress remains the sole public
    # route. NEXT_PUBLIC_* values are compiled into the published Next.js
    # bundle; this runtime ConfigMap cannot override a non-empty baked value.
    publicApiBaseUrl: ""
    internalApiBaseUrl: http://waf:8080

auth:
  google:
    # Must match the browser origin exactly, including the port. Register this
    # same URI in Google Cloud Console. Do not use algocrack.local over HTTP.
    redirectUri: http://localhost:3000/api/v1/auth/login/oauth2/code/google

waf:
  modsecRuleEngine: "On"
  backend: http://api-gateway:9090
  # Minikube ingress-nginx controller is on the cluster Pod network. Trust
  # only that network when accepting X-Real-IP for per-client WAF limits.
  trustedProxyCidrs:
    - 10.244.0.0/16

monitoring:
  enabled: true

# Match the live Bound claims. An empty storage class would omit
# storageClassName and let server-side apply try to clear an immutable field.
mysql:
  persistence:
    storageClass: standard

redis:
  persistence:
    storageClass: standard

complexity:
  submission:
    apiEnabled: true
    staticAnalysisEnabled: true
    dynamicProfilingEnabled: false
  problem:
    profileApiEnabled: true
    internalAuthRequireToken: true
  cxe:
    profileEnabled: false
    internalAuthRequireToken: true
    sandboxBackend: local-process
    productionVerified: false

complexityProfile:
  enabled: false
  redisAcl:
    enabled: false

secrets:
  useExisting: true
  appSecretName: algocrack-app-secrets
  jwtSecretName: jwt-signing-keys
