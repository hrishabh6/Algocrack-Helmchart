namespace:
  create: true
  name: algocrack

ingress:
  enabled: true
  className: nginx
  host: algocrack.local

secrets:
  useExisting: false
  appSecretName: ""
  jwtSecretName: ""

auth:
  google:
    clientId: your-google-client-id
    clientSecret: your-google-client-secret
    redirectUri: http://algocrack.local/api/v1/auth/login/oauth2/code/google
  jwt:
    privateKeyPem: |
      -----BEGIN PRIVATE KEY-----
      REPLACE_ME
      -----END PRIVATE KEY-----
    publicKeyPem: |
      -----BEGIN PUBLIC KEY-----
      REPLACE_ME
      -----END PUBLIC KEY-----

mysql:
  enabled: true
  auth:
    rootPassword: change-me
    username: root
    password: change-me

redis:
  enabled: true

services:
  codeExecutionEngine:
    workerCount: 5
  frontend:
    publicApiBaseUrl: ""
    internalApiBaseUrl: http://api-gateway:9090
