{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ include "algocrack.namespace" . }}
  labels:
    {{- include "algocrack.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alert-rules.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090
      - job_name: algocrack-backends
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - api-gateway:9090
              - auth-service:7483
              - problem-service:8084
              - submission-service:8080
              - code-execution-engine:8081
  alert-rules.yml: |
    groups:
      - name: algocrack-service-health
        rules:
          - alert: AlgoCrackTargetDown
            expr: up{job="algocrack-backends"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "AlgoCrack target is down"
              description: "{{ "{{" }} $labels.instance {{ "}}" }} has been unreachable for more than 1 minute."
          - alert: AlgoCrackHighServerErrorRate
            expr: |
              sum by (instance) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
              /
              clamp_min(sum by (instance) (rate(http_server_requests_seconds_count[5m])), 1)
              > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High server error rate"
              description: "{{ "{{" }} $labels.instance {{ "}}" }} has more than 5% 5xx responses over 5 minutes."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: {{ include "algocrack.namespace" . }}
  labels:
    {{- include "algocrack.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "algocrack.componentSelectorLabels" (dict "context" . "component" "prometheus") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "algocrack.componentSelectorLabels" (dict "context" . "component" "prometheus") | nindent 8 }}
    spec:
      containers:
        - name: prometheus
          image: {{ .Values.monitoring.prometheus.image | quote }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.monitoring.prometheus.retention }}
            - --web.enable-lifecycle
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
              readOnly: true
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ include "algocrack.namespace" . }}
  labels:
    {{- include "algocrack.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  selector:
    {{- include "algocrack.componentSelectorLabels" (dict "context" . "component" "prometheus") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.monitoring.prometheus.service.port }}
      targetPort: 9090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: {{ include "algocrack.namespace" . }}
  labels:
    {{- include "algocrack.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
data:
  loki.yml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    storage_config:
      filesystem:
        chunks_directory: /loki/chunks
        rules_directory: /loki/rules
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      allow_structured_metadata: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: {{ include "algocrack.namespace" . }}
  labels:
    {{- include "algocrack.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "algocrack.componentSelectorLabels" (dict "context" . "component" "loki") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "algocrack.componentSelectorLabels" (dict "context" . "component" "loki") | nindent 8 }}
    spec:
      {{- include "algocrack.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: loki
          image: {{ .Values.monitoring.loki.image | quote }}
          args:
            - -config.file=/etc/loki/loki.yml
          ports:
            - containerPort: 3100
          volumeMounts:
            - name: loki-config
              mountPath: /etc/loki
              readOnly: true
            - name: loki-data
              mountPath: /loki
      volumes:
        - name: loki-config
          configMap:
            name: loki-config
        - name: loki-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: {{ include "algocrack.namespace" . }}
  labels:
    {{- include "algocrack.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
spec:
  selector:
    {{- include "algocrack.componentSelectorLabels" (dict "context" . "component" "loki") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.monitoring.loki.service.port }}
      targetPort: 3100
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: {{ include "algocrack.namespace" . }}
  labels:
    {{- include "algocrack.labels" . | nindent 4 }}
    app.kubernetes.io/component: alloy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-alloy
  labels:
    {{- include "algocrack.labels" . | nindent 4 }}
    app.kubernetes.io/component: alloy
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "watch", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-alloy
  labels:
    {{- include "algocrack.labels" . | nindent 4 }}
    app.kubernetes.io/component: alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: {{ include "algocrack.namespace" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: {{ include "algocrack.namespace" . }}
  labels:
    {{- include "algocrack.labels" . | nindent 4 }}
    app.kubernetes.io/component: alloy
data:
  config.alloy: |
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        action        = "keep"
        regex         = "{{ include "algocrack.namespace" . }}"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component", "__meta_kubernetes_pod_label_app"]
        separator     = ""
        target_label  = "service"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.process.algocrack.receiver]
    }

    loki.process "algocrack" {
      stage.json {
        expressions = {
          level       = "level",
          app_service = "service",
          environment = "environment",
          kube_micro  = "kube_micro",
          event_type  = "event_type",
        }
      }

      stage.labels {
        values = {
          level       = "",
          app_service = "",
          environment = "",
          kube_micro  = "",
          event_type  = "",
        }
      }

      forward_to = [loki.write.local.receiver]
    }

    loki.write "local" {
      endpoint {
        url = "http://loki:{{ .Values.monitoring.loki.service.port }}/loki/api/v1/push"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: {{ include "algocrack.namespace" . }}
  labels:
    {{- include "algocrack.labels" . | nindent 4 }}
    app.kubernetes.io/component: alloy
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "algocrack.componentSelectorLabels" (dict "context" . "component" "alloy") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "algocrack.componentSelectorLabels" (dict "context" . "component" "alloy") | nindent 8 }}
    spec:
      serviceAccountName: alloy
      {{- include "algocrack.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: alloy
          image: {{ .Values.monitoring.alloy.image | quote }}
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: data
              mountPath: /var/lib/alloy/data
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: {{ include "algocrack.namespace" . }}
  labels:
    {{- include "algocrack.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
      - name: Loki
        uid: Loki
        type: loki
        access: proxy
        url: http://loki:{{ .Values.monitoring.loki.service.port }}
        editable: false
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: AlgoCrack
        orgId: 1
        folder: AlgoCrack
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: {{ include "algocrack.namespace" . }}
  labels:
    {{- include "algocrack.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  algocrack-overview.json: |
    {
      "schemaVersion": 39,
      "title": "AlgoCrack Overview",
      "uid": "algocrack-overview",
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-30m", "to": "now"},
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Backend Targets UP",
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "targets": [{"expr": "sum(up{job=\"algocrack-backends\"})", "refId": "A"}],
          "gridPos": {"h": 8, "w": 6, "x": 0, "y": 0}
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "HTTP Request Rate",
          "datasource": {"type": "prometheus", "uid": "Prometheus"},
          "targets": [{"expr": "sum by (instance) (rate(http_server_requests_seconds_count[5m]))", "legendFormat": "{{ "{{" }} instance {{ "}}" }}", "refId": "A"}],
          "gridPos": {"h": 8, "w": 18, "x": 6, "y": 0}
        },
        {
          "id": 5,
          "type": "logs",
          "title": "Recent Application Logs",
          "datasource": {"type": "loki", "uid": "Loki"},
          "targets": [{"expr": "{service=~\"api-gateway|auth-service|problem-service|submission-service|code-execution-engine|frontend\"}", "refId": "A"}],
          "options": {"dedupStrategy": "none", "enableLogDetails": true, "prettifyLogMessage": true, "showCommonLabels": false, "showLabels": false, "showTime": true, "sortOrder": "Descending", "wrapLogMessage": false},
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8}
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: {{ include "algocrack.namespace" . }}
  labels:
    {{- include "algocrack.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "algocrack.componentSelectorLabels" (dict "context" . "component" "grafana") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "algocrack.componentSelectorLabels" (dict "context" . "component" "grafana") | nindent 8 }}
    spec:
      containers:
        - name: grafana
          image: {{ .Values.monitoring.grafana.image | quote }}
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: {{ .Values.monitoring.grafana.adminUser | quote }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: {{ .Values.monitoring.grafana.adminPassword | quote }}
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          volumeMounts:
            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasource.yml
              subPath: datasource.yml
              readOnly: true
            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
              readOnly: true
            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
      volumes:
        - name: grafana-provisioning
          configMap:
            name: grafana-provisioning
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: {{ include "algocrack.namespace" . }}
  labels:
    {{- include "algocrack.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  selector:
    {{- include "algocrack.componentSelectorLabels" (dict "context" . "component" "grafana") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.monitoring.grafana.service.port }}
      targetPort: 3000
{{- end }}
