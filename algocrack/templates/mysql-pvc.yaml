{{- if .Values.mysql.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: {{ include "algocrack.namespace" . }}
  annotations:
    # Helm uninstall must not delete this claim. The Minikube StorageClass
    # reclaim policy is Delete, so a deleted claim would remove the database.
    helm.sh/resource-policy: keep
  labels:
    {{- include "algocrack.labels" . | nindent 4 }}
    {{- include "algocrack.componentLabel" "mysql" | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.mysql.persistence.size }}
  {{- include "algocrack.storageClassName" (dict "local" .Values.mysql.persistence.storageClass "global" .Values.global.storageClass) | nindent 2 }}
{{- end }}
