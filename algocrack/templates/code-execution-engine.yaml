apiVersion: v1
kind: ServiceAccount
metadata:
  name: cxe-job-runner
  namespace: {{ include "algocrack.namespace" . }}
  labels:
    {{- include "algocrack.labels" . | nindent 4 }}
    {{- include "algocrack.componentLabel" "code-execution-engine" | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cxe-job-runner
  namespace: {{ include "algocrack.namespace" . }}
  labels:
    {{- include "algocrack.labels" . | nindent 4 }}
    {{- include "algocrack.componentLabel" "code-execution-engine" | nindent 4 }}
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
      - jobs/status
    verbs:
      - create
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cxe-job-runner
  namespace: {{ include "algocrack.namespace" . }}
  labels:
    {{- include "algocrack.labels" . | nindent 4 }}
    {{- include "algocrack.componentLabel" "code-execution-engine" | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: cxe-job-runner
    namespace: {{ include "algocrack.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cxe-job-runner
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-execution-engine
  namespace: {{ include "algocrack.namespace" . }}
  labels:
    {{- include "algocrack.labels" . | nindent 4 }}
    {{- include "algocrack.componentLabel" "code-execution-engine" | nindent 4 }}
spec:
  replicas: {{ .Values.services.codeExecutionEngine.replicaCount }}
  selector:
    matchLabels:
      {{- include "algocrack.componentSelectorLabels" (dict "context" . "component" "code-execution-engine") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "algocrack.componentSelectorLabels" (dict "context" . "component" "code-execution-engine") | nindent 8 }}
    spec:
      serviceAccountName: cxe-job-runner
      {{- include "algocrack.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.services.codeExecutionEngine.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.services.codeExecutionEngine.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.services.codeExecutionEngine.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: code-execution-engine
          image: {{ printf "%s:%s" .Values.images.codeExecutionEngine.repository .Values.images.codeExecutionEngine.tag }}
          imagePullPolicy: {{ .Values.images.codeExecutionEngine.pullPolicy }}
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: algocrack-config
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            {{- toYaml .Values.services.codeExecutionEngine.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: {{ .Values.services.codeExecutionEngine.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.services.codeExecutionEngine.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.services.codeExecutionEngine.startupProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: {{ .Values.services.codeExecutionEngine.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.services.codeExecutionEngine.livenessProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: {{ .Values.services.codeExecutionEngine.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.services.codeExecutionEngine.readinessProbe.periodSeconds }}
---
apiVersion: v1
kind: Service
metadata:
  name: code-execution-engine
  namespace: {{ include "algocrack.namespace" . }}
  labels:
    {{- include "algocrack.labels" . | nindent 4 }}
    {{- include "algocrack.componentLabel" "code-execution-engine" | nindent 4 }}
spec:
  selector:
    {{- include "algocrack.componentSelectorLabels" (dict "context" . "component" "code-execution-engine") | nindent 4 }}
  ports:
    - name: http
      port: 8081
      targetPort: 8081
