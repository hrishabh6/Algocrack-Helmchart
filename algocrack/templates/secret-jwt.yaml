{{- if not .Values.secrets.useExisting }}
apiVersion: v1
kind: Secret
metadata:
  name: jwt-signing-keys
  namespace: {{ include "algocrack.namespace" . }}
  labels:
    {{- include "algocrack.labels" . | nindent 4 }}
type: Opaque
stringData:
  private.pem: |
{{ .Values.auth.jwt.privateKeyPem | nindent 4 }}
  public.pem: |
{{ .Values.auth.jwt.publicKeyPem | nindent 4 }}
{{- end }}
